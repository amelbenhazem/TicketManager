apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-frontend
  namespace: ticketmanager
  labels:
    app: ticket-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-frontend
  template:
    metadata:
      labels:
        app: ticket-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-agentpool-34739636-1
      imagePullSecrets:
        - name: nexus-registry
      containers:
        - name: frontend
          image: 10.1.1.4:8082/docker-ticketmanager/ticket-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
