# Ingress HTTPS — frontend (app.*) et backend (api.*) via NGINX Ingress Controller.
# Prérequis : setup-ingress-nginx.sh + secret ticketmanager-tls (ensure-tls-secret.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketmanager
  namespace: ticketmanager
  labels:
    app: ticketmanager
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # WebSocket (notifications Socket.IO)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.ticketmanager.local
        - api.ticketmanager.local
      secretName: ticketmanager-tls
  rules:
    - host: app.ticketmanager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-frontend
                port:
                  number: 3000
    - host: api.ticketmanager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-backend
                port:
                  number: 3001
