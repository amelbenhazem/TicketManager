trigger:
  - main

pool:
  name: ticketmanager-pool

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: "Install Node"

  # Backend
  - script: |
      cd backend
      npm ci
      npm run build
      npm run test
    displayName: "Backend build + test"

  # Frontend
  - script: |
      cd frontend
      npm ci
      npm run build
    displayName: "Frontend build"

  # Docker build
  - script: |
      docker build -t ticket-backend ./backend
      docker build -t ticket-frontend ./frontend
    displayName: "Docker build"
