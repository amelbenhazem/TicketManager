# =========================
  # TERRAFORM
  # =========================
  - stage: Terraform
    displayName: "Terraform IaC"
    dependsOn: Push
    variables:
      - group: terraform-secrets
    jobs:

      - job: TerraformInitValidatePlan
        displayName: "Terraform init/validate/plan"
        pool:
          name: ticketmanager-pool
        steps:

          - script: |
              az cloud register --name XpressAzureDC2 \
                --endpoint-resource-manager "https://management.dc2.xpressazure.com" \
                --suffix-storage-endpoint "dc2.xpressazure.com" \
                --suffix-keyvault-dns ".vault.dc2.xpressazure.com" \
                --endpoint-active-directory "https://login.microsoftonline.com/" \
                --endpoint-active-directory-graph-resource-id "https://graph.windows.net/" \
                --endpoint-active-directory-resource-id "https://management.dc2.xpressazure.com/" \
                --profile 2020-09-01-hybrid || true

              az cloud set --name XpressAzureDC2

              az login --service-principal \
                -u "$(ARM_CLIENT_ID)" \
                -p "$(ARM_CLIENT_SECRET)" \
                --tenant "$(ARM_TENANT_ID)"

              az account set --subscription "$(ARM_SUBSCRIPTION_ID)"
              az account show
            displayName: "Azure Stack CLI login avec SP"

          - script: |
              cd terraform
              terraform init \
                -backend-config="environment=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -backend-config="arm_endpoint=https://management.dc2.xpressazure.com" \
                -backend-config="resource_group_name=AmalBH" \
                -backend-config="storage_account_name=amalbhtfstate01" \
                -backend-config="container_name=tfstate" \
                -backend-config="key=terraform.tfstate" \
                -backend-config="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -backend-config="tenant_id=$(ARM_TENANT_ID)" \
                -backend-config="client_id=$(ARM_CLIENT_ID)" \
                -backend-config="client_secret=$(ARM_CLIENT_SECRET)"
            displayName: "Terraform Init"

          - script: |
              cd terraform
              terraform validate
            displayName: "Terraform Validate"

          - script: |
              cd terraform
              terraform plan -input=false -out=tfplan \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$(ARM_CLIENT_SECRET)" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)"
            displayName: "Terraform Plan"

      - job: TerraformManualApproval
        displayName: "Approval gate"
        dependsOn: TerraformInitValidatePlan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: "Vérifiez le plan Terraform et approuvez pour continuer."
              notifyUsers: "$(TF_APPROVERS)"
              onTimeout: "reject"
            timeoutInMinutes: 1440

      - job: TerraformApply
        displayName: "Terraform apply (main only)"
        dependsOn: TerraformManualApproval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool:
          name: ticketmanager-pool
        steps:

          - script: |
              az cloud set --name XpressAzureDC2

              az login --service-principal \
                -u "$(ARM_CLIENT_ID)" \
                -p "$(ARM_CLIENT_SECRET)" \
                --tenant "$(ARM_TENANT_ID)"

              az account set --subscription "$(ARM_SUBSCRIPTION_ID)"
            displayName: "Azure Stack CLI login avec SP"

          - script: |
              cd terraform
              terraform init \
                -backend-config="environment=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -backend-config="arm_endpoint=https://management.dc2.xpressazure.com" \
                -backend-config="resource_group_name=AmalBH" \
                -backend-config="storage_account_name=amalbhtfstate01" \
                -backend-config="container_name=tfstate" \
                -backend-config="key=terraform.tfstate" \
                -backend-config="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -backend-config="tenant_id=$(ARM_TENANT_ID)" \
                -backend-config="client_id=$(ARM_CLIENT_ID)" \
                -backend-config="client_secret=$(ARM_CLIENT_SECRET)"

              terraform apply -input=false -auto-approve \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$(ARM_CLIENT_SECRET)" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)"
            displayName: "Terraform Apply"