trigger:
  - main
  - develop

pool:
  name: ticketmanager-pool

stages:

  # =========================
  # BUILD
  # =========================
  - stage: Build
    displayName: "Build"
    jobs:
      - job: BuildJob
        displayName: "Build Backend & Frontend"
        steps:

          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Install Node.js 22"

          - script: |
              cd backend && npm ci && npm run build
            displayName: "Backend build"

          - script: |
              cd frontend && npm ci && npm run build
            displayName: "Frontend build"

  # =========================
  # TEST
  # =========================
  - stage: Test
    displayName: "Tests"
    dependsOn: Build
    jobs:

      - job: UnitTests
        displayName: "Unit Tests"
        steps:

          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Install Node.js 22"

          - script: |
              cd backend
              npm ci
              npm run test -- --forceExit
            displayName: "Unit tests"

          - script: |
              cd backend
              npm run test:cov -- --forceExit
            displayName: "Coverage report"

      - job: IntegrationTests
        displayName: "Integration Tests"
        steps:

          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Install Node.js 22"

          - script: |
              cd backend
              npm ci
              npm run test:int -- --forceExit
            displayName: "Integration tests"
            continueOnError: true

  # =========================
  # CODE QUALITY
  # =========================
  - stage: CodeQuality
    displayName: "Code Quality"
    dependsOn: Test
    jobs:
      - job: SonarJob
        displayName: "SonarQube Analysis"
        steps:

          - script: |
              docker run --rm \
                --network host \
                -e SONAR_HOST_URL=$(SONAR_HOST_URL) \
                -e SONAR_TOKEN=$(SONAR_TOKEN) \
                -v "$(System.DefaultWorkingDirectory):/usr/src" \
                sonarsource/sonar-scanner-cli \
                -Dsonar.projectKey=ticket-manager \
                -Dsonar.projectName=TicketManager \
                -Dsonar.sources=backend/src,frontend \
                -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/** \
                -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            displayName: "Run SonarQube Analysis"

  # =========================
  # SECURITY
  # =========================
  - stage: Security
    displayName: "Security Scan"
    dependsOn: Test
    jobs:
      - job: SnykJob
        displayName: "Snyk Vulnerability Scan"
        steps:

          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Install Node.js 22"

          - script: |
              npm install -g snyk
              snyk auth $(SNYK_TOKEN)
            displayName: "Authenticate Snyk"

          - script: |
              cd backend && snyk test --severity-threshold=high
            displayName: "Snyk backend scan"

          - script: |
              cd frontend && snyk test --severity-threshold=high
            displayName: "Snyk frontend scan"
            continueOnError: true

  # =========================
  # DOCKER BUILD
  # =========================
  - stage: Docker
    displayName: "Docker Build"
    dependsOn:
      - CodeQuality
      - Security
    jobs:
      - job: DockerJob
        displayName: "Build Docker Images"
        steps:

          - script: |
              docker build -t ticket-backend:$(Build.BuildId) ./backend
              docker build -t ticket-frontend:$(Build.BuildId) ./frontend
            displayName: "Build images"