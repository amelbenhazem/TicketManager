trigger:
  branches:
    include:
      - main
      - develop

pool:
  name: ticketmanager-pool

stages:

  # =========================
  # BUILD
  # =========================
  - stage: Build
    displayName: "Build"
    jobs:
      - job: BuildJob
        displayName: "Build Backend & Frontend"
        steps:

          # ✅ CORRECTION 1 : Cache node_modules backend
          # Évite de retélécharger les dépendances à chaque run
          - task: Cache@2
            displayName: "Cache backend node_modules"
            inputs:
              key: 'npm | "$(Agent.OS)" | backend/package-lock.json'
              path: backend/node_modules
              cacheHitVar: BACKEND_CACHE_RESTORED

          # ✅ CORRECTION 1 : Cache node_modules frontend
          - task: Cache@2
            displayName: "Cache frontend node_modules"
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              path: frontend/node_modules
              cacheHitVar: FRONTEND_CACHE_RESTORED

          - script: |
              cd backend && npm ci --prefer-offline && npm run build
            displayName: "Backend build"

          - script: |
              cd frontend && npm ci --prefer-offline && npm run build
            displayName: "Frontend build"

  # =========================
  # TEST
  # =========================
  - stage: Test
    displayName: "Tests"
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: "Unit Tests"
        steps:

          # ✅ CORRECTION 1 : Réutilisation du cache (plus de npm ci inutile)
          - task: Cache@2
            displayName: "Restore backend node_modules from cache"
            inputs:
              key: 'npm | "$(Agent.OS)" | backend/package-lock.json'
              path: backend/node_modules
              cacheHitVar: BACKEND_CACHE_RESTORED

          - script: |
              cd backend
              npm ci --prefer-offline
              npm run test -- --forceExit
            displayName: "Unit tests"

          - script: |
              cd backend
              npm run test:cov -- --forceExit
            displayName: "Coverage report"

          # ✅ CORRECTION 3 : Publier les résultats de tests dans Azure DevOps
          # Permet de voir les tests directement dans l'interface du pipeline
          - task: PublishTestResults@2
            displayName: "Publish test results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: backend/coverage/junit.xml
            condition: always()

          # ✅ CORRECTION 3 : Publier le rapport de coverage
          # Visible dans l'onglet "Code Coverage" du pipeline
          - task: PublishCodeCoverageResults@1
            displayName: "Publish coverage report"
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: backend/coverage/cobertura-coverage.xml
            condition: always()

      - job: IntegrationTests
        displayName: "Integration Tests"
        steps:

          - task: Cache@2
            displayName: "Restore backend node_modules from cache"
            inputs:
              key: 'npm | "$(Agent.OS)" | backend/package-lock.json'
              path: backend/node_modules
              cacheHitVar: BACKEND_CACHE_RESTORED

          - script: |
              cd backend
              npm ci --prefer-offline
              npm run test:int -- --forceExit --testTimeout=30000
            displayName: "Integration tests"
            continueOnError: true

  # =========================
  # CODE QUALITY
  # =========================
  - stage: CodeQuality
    displayName: "Code Quality"
    dependsOn: Test
    jobs:
      - job: SonarJob
        displayName: "SonarQube Analysis"
        steps:
          - script: |
              docker run --rm \
                --network host \
                -e SONAR_HOST_URL=http://localhost:9000 \
                -e SONAR_TOKEN="$(SONAR_TOKEN)" \
                -v "$(System.DefaultWorkingDirectory):/usr/src" \
                -w /usr/src \
                sonarsource/sonar-scanner-cli \
                -Dsonar.projectKey=ticket-manager \
                -Dsonar.projectName=TicketManager \
                -Dsonar.sources=backend/src,frontend \
                -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/** \
                -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            displayName: "Run SonarQube Analysis"

  # =========================
  # SECURITY
  # =========================
  - stage: Security
    displayName: "Security Scan"
    dependsOn: Test
    jobs:
      - job: SnykJob
        displayName: "Snyk Vulnerability Scan"
        steps:
          - script: |
              sudo npm install -g snyk
              export SNYK_TOKEN=$(SNYK_TOKEN)
              cd backend
              snyk test --severity-threshold=high
              cd ../frontend
              snyk test --severity-threshold=high || true
            displayName: "Snyk scan (backend + frontend)"

  # =========================
  # DOCKER BUILD
  # =========================
  - stage: Docker
    displayName: "Docker Build"
    dependsOn:
      - CodeQuality
      - Security
    jobs:
      - job: DockerJob
        displayName: "Build Docker Images"
        steps:
          - script: |
              docker build -t ticket-backend:$(Build.BuildId) ./backend
              docker build -t ticket-frontend:$(Build.BuildId) ./frontend
            displayName: "Build images"

  # =========================
  # TRIVY SCAN
  # =========================
  - stage: TrivyScan
    displayName: "Trivy Security Scan"
    dependsOn: Docker
    jobs:
      - job: TrivyJob
        displayName: "Scan Docker Images"
        steps:
          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --no-progress \
                ticket-backend:$(Build.BuildId)
            displayName: "Trivy scan backend image"
            continueOnError: true

          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --no-progress \
                ticket-frontend:$(Build.BuildId)
            displayName: "Trivy scan frontend image"
            continueOnError: true

  # =========================
  # PUSH TO NEXUS
  # =========================
  - stage: Push
    displayName: "Push to Nexus"
    dependsOn: TrivyScan
    jobs:
      - job: PushJob
        displayName: "Push Docker Images"
        steps:
          - script: |
              echo "$(NEXUS_PASSWORD)" | docker login $(NEXUS_URL) \
                -u $(NEXUS_USER) --password-stdin
            displayName: "Login to Nexus"

          # ✅ CORRECTION 4 : Tag différent selon la branche
          # main  → tag "latest"   (image stable de production)
          # develop → tag "dev-XXX" (image de développement, n'écrase pas latest)
          - script: |
              if [ "$(Build.SourceBranch)" = "refs/heads/main" ]; then
                STABLE_TAG="latest"
              else
                STABLE_TAG="dev-$(Build.BuildId)"
              fi

              docker tag ticket-backend:$(Build.BuildId) $(NEXUS_URL)/ticket-backend:$(Build.BuildId)
              docker tag ticket-backend:$(Build.BuildId) $(NEXUS_URL)/ticket-backend:$STABLE_TAG
              docker push $(NEXUS_URL)/ticket-backend:$(Build.BuildId)
              docker push $(NEXUS_URL)/ticket-backend:$STABLE_TAG

              docker tag ticket-frontend:$(Build.BuildId) $(NEXUS_URL)/ticket-frontend:$(Build.BuildId)
              docker tag ticket-frontend:$(Build.BuildId) $(NEXUS_URL)/ticket-frontend:$STABLE_TAG
              docker push $(NEXUS_URL)/ticket-frontend:$(Build.BuildId)
              docker push $(NEXUS_URL)/ticket-frontend:$STABLE_TAG
            displayName: "Tag and push images"

          # ✅ CORRECTION 5 : Logout après push
          # Nettoie les credentials Docker de l'agent
          - script: |
              docker logout $(NEXUS_URL)
            displayName: "Logout from Nexus"
            condition: always()

  # =========================
  # TERRAFORM
  # =========================
  - stage: Terraform
    displayName: "Terraform IaC"
    dependsOn: Push
    jobs:

      - job: TerraformInitValidatePlan
        displayName: "Terraform init/validate/plan"
        pool:
          name: ticketmanager-pool
        steps:

          # ✅ CONSERVÉ : artifact pipeline pour tfstate (pas de storage account disponible)
          # continueOnError: true est important → au 1er run le tfstate n'existe pas encore
          - task: DownloadPipelineArtifact@2
            displayName: "Download tfstate (si existant)"
            continueOnError: true
            inputs:
              artifact: tfstate
              path: $(System.DefaultWorkingDirectory)/terraform

          - script: |
              az cloud register --name XpressAzureDC2 \
                --endpoint-resource-manager "https://management.dc2.xpressazure.com" \
                --suffix-storage-endpoint "dc2.xpressazure.com" \
                --suffix-keyvault-dns ".vault.dc2.xpressazure.com" \
                --endpoint-active-directory "https://login.microsoftonline.com/" \
                --endpoint-active-directory-graph-resource-id "https://graph.windows.net/" \
                --endpoint-active-directory-resource-id "https://management.dc2.xpressazure.com/" \
                --profile 2020-09-01-hybrid || true
              az cloud set --name XpressAzureDC2
              az login --service-principal \
                -u "$(ARM_CLIENT_ID)" \
                -p "$(ARM_CLIENT_SECRET)" \
                --tenant "$(ARM_TENANT_ID)"
              az account set --subscription "$(ARM_SUBSCRIPTION_ID)"
              az account show
            displayName: "Azure Stack CLI login"

          - script: |
              cd terraform
              terraform init
            displayName: "Terraform Init"

          - script: |
              cd terraform
              terraform validate
            displayName: "Terraform Validate"

          - script: |
              cd terraform
              terraform plan -input=false -out=tfplan \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$(ARM_CLIENT_SECRET)" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)"
            displayName: "Terraform Plan"

          - task: PublishPipelineArtifact@1
            displayName: "Publish tfplan"
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/terraform/tfplan
              artifact: tfplan

      - job: TerraformManualApproval
        displayName: "Approval gate"
        dependsOn: TerraformInitValidatePlan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: "Vérifiez le plan Terraform et approuvez pour continuer."
              notifyUsers: "$(TF_APPROVERS)"
              onTimeout: "reject"
            timeoutInMinutes: 1440

      - job: TerraformApply
        displayName: "Terraform apply (main only)"
        dependsOn: TerraformManualApproval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool:
          name: ticketmanager-pool
        steps:

          - task: DownloadPipelineArtifact@2
            displayName: "Download tfplan"
            inputs:
              artifact: tfplan
              path: $(System.DefaultWorkingDirectory)/terraform

          - script: |
              az cloud set --name XpressAzureDC2
              az login --service-principal \
                -u "$(ARM_CLIENT_ID)" \
                -p "$(ARM_CLIENT_SECRET)" \
                --tenant "$(ARM_TENANT_ID)"
              az account set --subscription "$(ARM_SUBSCRIPTION_ID)"
            displayName: "Azure Stack CLI login"

          - script: |
              cd terraform
              terraform init
              terraform apply -input=false -auto-approve tfplan
            displayName: "Terraform Apply"

          # ✅ CONSERVÉ : tfstate publié comme artifact pipeline
          - task: PublishPipelineArtifact@1
            displayName: "Publish tfstate"
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/terraform/terraform.tfstate
              artifact: tfstate