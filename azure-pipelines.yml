trigger:
  branches:
    include:
      - main
      - develop

pool:
  name: ticketmanager-pool

variables:
  # Cache npm local sur vm-gestion (évite Cache@2 Azure DevOps ~700 Mo upload/download)
  NPM_CACHE_FOLDER: /home/azureuser/.cache/ticketmanager-npm
  # Agent sur VM-gestion : Nexus écoute en local (évite dépendance à l'IP publique)
  NEXUS_REGISTRY: localhost:8082
  NEXUS_REPO: docker-ticketmanager
  # Réduit pour Stack Hub Dev/Test (FabricVmPlacementError si quota insuffisant)
  VM_SIZE_GESTION: Standard_D2s_v3
  VM_SIZE_DB: Standard_D2s_v3
  # URL API vue par le navigateur (NodePort backend K8s sur worker)
  FRONTEND_API_URL: http://10.1.3.4:30081
  # Kubernetes CD — registre vu depuis les nœuds (pas localhost)
  K8S_REGISTRY: 10.1.1.4:8082
  K8S_KUBECONFIG: /home/azureuser/kubernetes/ticketmanager-k8s/kubeconfig/kubeconfig.dc2.json
  K8S_MONGODB_URI: mongodb://10.1.2.4:27017/ticketmanager
  K8S_CORS_ORIGIN: http://10.1.3.4:30080,http://10.1.3.5:30080
  # IPs des nœuds workers (pull images depuis Nexus HTTP)
  K8S_WORKER_IPS: 10.1.3.4 10.1.3.5

stages:

  # =========================
  # BUILD
  # =========================
  - stage: Build
    displayName: "Build"
    jobs:
      - job: BuildJob
        displayName: "Build Backend & Frontend"
        steps:

          - script: mkdir -p "$(NPM_CACHE_FOLDER)"
            displayName: "Prepare local npm cache"

          - script: |
              cd backend && npm ci --cache "$(NPM_CACHE_FOLDER)" && npm run build
            displayName: "Backend build"

          - script: |
              cd frontend && npm ci --cache "$(NPM_CACHE_FOLDER)" && npm run build
            displayName: "Frontend build"

  # =========================
  # TEST (temporairement désactivé)
  # =========================
  # - stage: Test
  #   displayName: "Tests"
  #   dependsOn: Build
  #   jobs:
  #     - job: UnitTests
  #       displayName: "Unit Tests"
  #       steps:
  #
  #         - task: Cache@2
  #           displayName: "Restore npm cache"
  #           inputs:
  #             key: 'npm | "$(Agent.OS)" | backend/package-lock.json | frontend/package-lock.json'
  #             path: $(NPM_CACHE_FOLDER)
  #             restoreKeys: |
  #               npm | "$(Agent.OS)"
  #
  #         - script: |
  #             cd backend
  #             npm ci --cache "$(NPM_CACHE_FOLDER)" --prefer-offline
  #             npm run test -- --forceExit
  #           displayName: "Unit tests"
  #
  #         - script: |
  #             cd backend
  #             npm run test:cov -- --forceExit
  #           displayName: "Coverage report"
  #
  #         - task: PublishTestResults@2
  #           displayName: "Publish test results"
  #           inputs:
  #             testResultsFormat: JUnit
  #             testResultsFiles: backend/coverage/junit.xml
  #           condition: always()
  #
  #         - task: PublishCodeCoverageResults@1
  #           displayName: "Publish coverage report"
  #           inputs:
  #             codeCoverageTool: Cobertura
  #             summaryFileLocation: backend/coverage/cobertura-coverage.xml
  #           condition: always()
  #
  #     - job: IntegrationTests
  #       displayName: "Integration Tests"
  #       steps:
  #
  #         - task: Cache@2
  #           displayName: "Restore npm cache"
  #           inputs:
  #             key: 'npm | "$(Agent.OS)" | backend/package-lock.json | frontend/package-lock.json'
  #             path: $(NPM_CACHE_FOLDER)
  #             restoreKeys: |
  #               npm | "$(Agent.OS)"
  #
  #         - script: |
  #             cd backend
  #             npm ci --cache "$(NPM_CACHE_FOLDER)" --prefer-offline
  #             npm run test:int -- --forceExit --testTimeout=30000
  #           displayName: "Integration tests"
  #           continueOnError: true

  # =========================
  # CODE QUALITY
  # =========================
  - stage: CodeQuality
    displayName: "Code Quality"
    dependsOn: Build
    jobs:
      - job: SonarJob
        displayName: "SonarQube Analysis"
        steps:
          - script: |
              echo "Longueur du token recu : $(printf '%s' "$SONAR_TOKEN" | wc -c)"
              docker run --rm \
                --network host \
                -e SONAR_HOST_URL=http://localhost:9000 \
                -v "$(System.DefaultWorkingDirectory):/usr/src" \
                -w /usr/src \
                sonarsource/sonar-scanner-cli \
                -Dsonar.login="$SONAR_TOKEN" \
                -Dsonar.host.url=http://localhost:9000 \
                -Dsonar.projectKey=ticket-manager \
                -Dsonar.projectName=TicketManager \
                -Dsonar.sources=backend/src,frontend \
                -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/** \
                -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            displayName: "Run SonarQube Analysis"
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

  # =========================
  # SECURITY (temporairement désactivé)
  # =========================
  # - stage: Security
  #   displayName: "Security Scan"
  #   dependsOn: Build
  #   jobs:
  #     - job: SnykJob
  #       displayName: "Snyk Vulnerability Scan"
  #       steps:
  #         - script: |
  #             sudo npm install -g snyk
  #             cd backend
  #             snyk test --severity-threshold=high
  #             cd ../frontend
  #             snyk test --severity-threshold=high || true
  #           displayName: "Snyk scan (backend + frontend)"
  #           env:
  #             SNYK_TOKEN: $(SNYK_TOKEN)

  # =========================
  # DOCKER BUILD
  # =========================
  - stage: Docker
    displayName: "Docker Build"
    dependsOn: CodeQuality
    jobs:
      - job: DockerJob
        displayName: "Build Docker Images"
        steps:
          - script: |
              docker build -t ticket-backend:$(Build.BuildId) ./backend
              docker build \
                --build-arg NEXT_PUBLIC_API_URL=$(FRONTEND_API_URL) \
                -t ticket-frontend:$(Build.BuildId) ./frontend
            displayName: "Build images"

  # =========================
  # TRIVY SCAN (temporairement désactivé)
  # =========================
  # - stage: TrivyScan
  #   displayName: "Trivy Security Scan"
  #   dependsOn: Docker
  #   jobs:
  #     - job: TrivyJob
  #       displayName: "Scan Docker Images"
  #       steps:
  #         - script: |
  #             docker run --rm \
  #               -v /var/run/docker.sock:/var/run/docker.sock \
  #               aquasec/trivy:latest image \
  #               --exit-code 1 \
  #               --severity HIGH,CRITICAL \
  #               --no-progress \
  #               ticket-backend:$(Build.BuildId)
  #           displayName: "Trivy scan backend image"
  #           continueOnError: true
  #
  #         - script: |
  #             docker run --rm \
  #               -v /var/run/docker.sock:/var/run/docker.sock \
  #               aquasec/trivy:latest image \
  #               --exit-code 1 \
  #               --severity HIGH,CRITICAL \
  #               --no-progress \
  #               ticket-frontend:$(Build.BuildId)
  #           displayName: "Trivy scan frontend image"
  #           continueOnError: true

  # =========================
  # PUSH TO NEXUS
  # =========================
  - stage: Push
    displayName: "Push to Nexus"
    dependsOn: Docker
    jobs:
      - job: PushJob
        displayName: "Push Docker Images"
        steps:
          - script: |
              nexus_ready() {
                code=$(curl -s --connect-timeout 5 -o /dev/null -w "%{http_code}" "http://$(NEXUS_REGISTRY)/v2/" || echo "000")
                # 401 = registry up but non authentifié (normal)
                [ "$code" = "401" ] || [ "$code" = "200" ]
              }

              if ! nexus_ready; then
                echo "Nexus injoignable sur $(NEXUS_REGISTRY) — tentative docker start nexus..."
                docker start nexus 2>/dev/null || true
                for i in $(seq 1 18); do
                  sleep 10
                  if nexus_ready; then
                    echo "Nexus prêt (tentative $i)."
                    break
                  fi
                  echo "Attente Nexus... ($i/18)"
                done
              fi

              if ! nexus_ready; then
                echo "##[error]Nexus indisponible. Sur VM-gestion: docker ps -a | grep nexus && docker logs nexus --tail 50"
                exit 1
              fi

              echo "$NEXUS_PASSWORD" | docker login $(NEXUS_REGISTRY) \
                -u $(NEXUS_USER) --password-stdin
            displayName: "Login to Nexus"
            env:
              NEXUS_PASSWORD: $(NEXUS_PASSWORD)

          - script: |
              if [ "$(Build.SourceBranch)" = "refs/heads/main" ]; then
                STABLE_TAG="latest"
              else
                STABLE_TAG="dev-$(Build.BuildId)"
              fi

              IMAGE_PREFIX="$(NEXUS_REGISTRY)/$(NEXUS_REPO)"

              docker tag ticket-backend:$(Build.BuildId) ${IMAGE_PREFIX}/ticket-backend:$(Build.BuildId)
              docker tag ticket-backend:$(Build.BuildId) ${IMAGE_PREFIX}/ticket-backend:$STABLE_TAG
              docker push ${IMAGE_PREFIX}/ticket-backend:$(Build.BuildId)
              docker push ${IMAGE_PREFIX}/ticket-backend:$STABLE_TAG

              docker tag ticket-frontend:$(Build.BuildId) ${IMAGE_PREFIX}/ticket-frontend:$(Build.BuildId)
              docker tag ticket-frontend:$(Build.BuildId) ${IMAGE_PREFIX}/ticket-frontend:$STABLE_TAG
              docker push ${IMAGE_PREFIX}/ticket-frontend:$(Build.BuildId)
              docker push ${IMAGE_PREFIX}/ticket-frontend:$STABLE_TAG
            displayName: "Tag and push images"

          - script: |
              docker logout $(NEXUS_REGISTRY)
            displayName: "Logout from Nexus"
            condition: always()

  # =========================
  # TERRAFORM
  # =========================
  - stage: Terraform
    displayName: "Terraform IaC"
    dependsOn: Push
    jobs:

      - job: TerraformInitValidatePlan
        displayName: "Terraform init/validate/plan"
        pool:
          name: ticketmanager-pool
        steps:

          - task: DownloadPipelineArtifact@2
            displayName: "Download tfstate (si existant)"
            continueOnError: true
            inputs:
              artifact: tfstate
              path: $(System.DefaultWorkingDirectory)/terraform

          - script: |
              az cloud register --name XpressAzureDC2 \
                --endpoint-resource-manager "https://management.dc2.xpressazure.com" \
                --suffix-storage-endpoint "dc2.xpressazure.com" \
                --suffix-keyvault-dns ".vault.dc2.xpressazure.com" \
                --endpoint-active-directory "https://login.microsoftonline.com/" \
                --endpoint-active-directory-graph-resource-id "https://graph.windows.net/" \
                --endpoint-active-directory-resource-id "https://management.xpressazure.com/ee8e5b2b-3e31-4a83-93b6-28f3739efd6d" \
                --profile 2020-09-01-hybrid || true
              az cloud set --name XpressAzureDC2
              az login --service-principal \
                -u "$(ARM_CLIENT_ID)" \
                -p "$ARM_CLIENT_SECRET" \
                --tenant "$(ARM_TENANT_ID)"
              az account set --subscription "$(ARM_SUBSCRIPTION_ID)"
              az account show
            displayName: "Azure Stack CLI login"
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)

          - script: |
              cd terraform
              terraform init
            displayName: "Terraform Init"

          - script: |
              cd terraform
              terraform validate
            displayName: "Terraform Validate"

          - script: |
              cd terraform
              terraform plan -input=false -out=tfplan \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                -var="vm_size_gestion=$(VM_SIZE_GESTION)" \
                -var="vm_size_db=$(VM_SIZE_DB)"
            displayName: "Terraform Plan"
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)

          - task: PublishPipelineArtifact@1
            displayName: "Publish tfplan"
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/terraform/tfplan
              artifact: tfplan

      - job: TerraformManualApproval
        displayName: "Approval gate"
        dependsOn: TerraformInitValidatePlan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: "Vérifiez le plan Terraform et approuvez pour continuer."
              notifyUsers: "$(TF_APPROVERS)"
              onTimeout: "reject"
            timeoutInMinutes: 1440

      - job: TerraformApply
        displayName: "Terraform apply (main only)"
        dependsOn: TerraformManualApproval
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool:
          name: ticketmanager-pool
        steps:

          - script: |
              az cloud set --name XpressAzureDC2
              az login --service-principal \
                -u "$(ARM_CLIENT_ID)" \
                -p "$ARM_CLIENT_SECRET" \
                --tenant "$(ARM_TENANT_ID)"
              az account set --subscription "$(ARM_SUBSCRIPTION_ID)"
            displayName: "Azure Stack CLI login"
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)

          - script: |
              cd terraform
              terraform init
            displayName: "Terraform Init"

          - script: |
              cd terraform
              RG="AmalBH-RG"
              SUB="$(ARM_SUBSCRIPTION_ID)"

              # --- network.tf ---
              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_virtual_network.main \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/virtualNetworks/ticketmanager-iac-vnet || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_group.mgmt \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-mgmt || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_group.db \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-db || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_group.aks \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-aks || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_rule.mgmt_ssh \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-mgmt/securityRules/AllowSSH || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_rule.db_ssh_from_mgmt \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-db/securityRules/AllowSSHFromMgmt || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_rule.db_mongo_from_mgmt \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-db/securityRules/AllowMongoFromMgmtSubnet || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_rule.db_mongo_from_aks \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-db/securityRules/AllowMongoFromAksSubnet || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_security_rule.aks_allow_internal \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkSecurityGroups/ticketmanager-iac-nsg-aks/securityRules/AllowVnetInbound || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_subnet.mgmt \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/virtualNetworks/ticketmanager-iac-vnet/subnets/ticketmanager-iac-snet-mgmt || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_subnet.db \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/virtualNetworks/ticketmanager-iac-vnet/subnets/ticketmanager-iac-snet-db || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_subnet.aks \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/virtualNetworks/ticketmanager-iac-vnet/subnets/ticketmanager-iac-snet-aks || true

              # --- vm-management.tf ---
              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_public_ip.gestion \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/publicIPAddresses/ticketmanager-iac-vm-gestion-pip || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_interface.gestion \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkInterfaces/ticketmanager-iac-vm-gestion-nic || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_virtual_machine.gestion \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Compute/virtualMachines/ticketmanager-iac-vm-gestion || true

              # --- vm-db.tf ---
              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_network_interface.db \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/networkInterfaces/ticketmanager-iac-vm-db-nic || true

              terraform import \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                azurestack_virtual_machine.db \
                /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Compute/virtualMachines/ticketmanager-iac-vm-db || true

              echo " Import terminé"
            displayName: "Terraform Import ALL existing resources"
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)

          - script: |
              cd terraform
              terraform plan -input=false \
                -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
                -var="tenant_id=$(ARM_TENANT_ID)" \
                -var="client_id=$(ARM_CLIENT_ID)" \
                -var="client_secret=$ARM_CLIENT_SECRET" \
                -var="stack_arm_environment_name=$(STACK_ARM_ENVIRONMENT_NAME)" \
                -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                -var="vm_size_gestion=$(VM_SIZE_GESTION)" \
                -var="vm_size_db=$(VM_SIZE_DB)" \
                -out=tfplan-apply

              terraform apply -input=false -auto-approve tfplan-apply
            displayName: "Terraform Plan + Apply (after import)"
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)

          - task: PublishPipelineArtifact@1
            displayName: "Publish tfstate"
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/terraform/terraform.tfstate
              artifact: tfstate

  # =========================
  # DEPLOY KUBERNETES (CD)
  # =========================
  - stage: DeployK8s
    displayName: "Deploy to Kubernetes"
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:

      - job: K8sManualApproval
        displayName: "Approval gate (K8s deploy)"
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: "Approuver le déploiement TicketManager sur le cluster Kubernetes (images Build $(Build.BuildId))."
              notifyUsers: "$(TF_APPROVERS)"
              onTimeout: "reject"
            timeoutInMinutes: 1440

      - job: K8sDeploy
        displayName: "kubectl apply + rollout"
        dependsOn: K8sManualApproval
        pool:
          name: ticketmanager-pool
        steps:
          - checkout: self
            displayName: "Checkout (manifests k8s/)"

          - script: |
              chmod +x k8s/scripts/setup-worker-insecure-registry.sh
              export K8S_REGISTRY="$(K8S_REGISTRY)"
              export K8S_WORKER_IPS="$(K8S_WORKER_IPS)"
              ./k8s/scripts/setup-worker-insecure-registry.sh
            displayName: "Configure insecure registry on K8s workers"

          - script: |
              chmod +x k8s/deploy-pipeline.sh
              export KUBECONFIG="$(K8S_KUBECONFIG)"
              export K8S_REGISTRY="$(K8S_REGISTRY)"
              export NEXUS_REPO="$(NEXUS_REPO)"
              export IMAGE_TAG="latest"
              export NEXUS_USER="$(NEXUS_USER)"
              export NEXUS_PASSWORD="$NEXUS_PASSWORD"
              export K8S_MONGODB_URI="$(K8S_MONGODB_URI)"
              export K8S_CORS_ORIGIN="$(K8S_CORS_ORIGIN)"
              export JWT_SECRET="$JWT_SECRET"
              ./k8s/deploy-pipeline.sh
            displayName: "Deploy TicketManager to K8s"
            env:
              NEXUS_PASSWORD: $(NEXUS_PASSWORD)
              JWT_SECRET: $(JWT_SECRET)