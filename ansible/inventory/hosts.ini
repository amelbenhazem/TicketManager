# Exécuter depuis VM-gestion (pas VM-db) :
#
#   sudo apt update && sudo apt install -y python3-pip
#   pip3 install --user ansible
#   export PATH="$HOME/.local/bin:$PATH"
#   cd ~/azagent/_work/1/s/ansible   # ou clone du repo
#   ansible-playbook playbooks/mongodb.yml
#
# Prérequis : ~/.ssh/id_rsa + VM-db démarrée (10.1.2.4)

[db]
vm-db ansible_host=10.1.2.4 ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[db:vars]
ansible_python_interpreter=/usr/bin/python3
