sonar.projectKey=TicketManagerTicketManager
sonar.projectName=TicketManager
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000
# Use an environment variable for the token: pass -Dsonar.token or set SONAR_TOKEN

sonar.sources=backend/src,frontend/app,frontend/components,frontend/hooks,frontend/lib,frontend/types
sonar.tests=backend/src,backend/test,frontend
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts
# Exclude frontend UI and scripts from coverage until frontend tests are added
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.stories.*x,**/main.ts,**/*.module.ts,**/index.ts,frontend/**,backend/src/scripts/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Define “New Code” relative to your main branch to avoid gating on legacy code
sonar.newCode.referenceBranch=main
